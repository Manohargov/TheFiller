name: Build installers
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test
      - run: npm run test:webkit
  macos:
    needs: tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/build-macos-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: The-Filler-macOS-DMG
          path: releases/macos/*.dmg
          if-no-files-found: error
  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install installer compiler
        run: choco install innosetup --no-progress -y
      - name: Build Windows setup EXE
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: The-Filler-Windows-Setup-EXE
          path: releases/windows/*.exe
          if-no-files-found: error
